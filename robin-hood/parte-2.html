        .camada[data-camada^="c-flamula-p4"] {

        /* Cap. 16 (Pág. 5): câmera panorâmica interativa + flecha em voo + partição em V no alvo */
        #drop-zone-5 .scene-img { opacity: 0; }
        .rh2-p5-palco {

        .rh2-p5-mundo {

            will-change: transform;

        .rh2-p5-palco.disparou .rh2-p5-mundo {
            transform: translate3d(-36.71%, 0, 0);
        }
        .rh2-p5-palco.impacto .rh2-p5-mundo {
            animation: rh2AlvoTremer 0.32s ease-out;

        .rh2-p5-mundo > img {

        .rh2-p5-svg {
            position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
        }

        .rh2-cap-cima, .rh2-cap-baixo {
            transform-origin: 1169px 446px;
            transition: transform 0.36s cubic-bezier(0.22, 1.45, 0.36, 1);
        }
        .rh2-p5-palco.impacto .rh2-cap-cima {
            transform: rotate(-25deg) translate(-12px, -9px);
        }
        .rh2-p5-palco.impacto .rh2-cap-baixo {
            transform: rotate(25deg) translate(-12px, 9px);
        }

        .rh2-flecha-robin {
            opacity: 0;
            transform-origin: 1169px 446px;
            transform: translate3d(-674px, -39px, 0) rotate(-3deg);
            filter: drop-shadow(0 4px 4px rgba(30, 15, 5, 0.38));
        }
        .rh2-p5-palco.disparou .rh2-flecha-robin {
            animation: rh2FlechaVoo 1.28s cubic-bezier(0.22, 0.06, 0.32, 1) forwards;

        .rh2-rastro {
            opacity: 0;

            stroke-dashoffset: 220;
        }
        .rh2-p5-palco.disparou .rh2-rastro {
            animation: rh2RastroVoo 1.22s ease-out forwards;
        }

        .rh2-crac {
            opacity: 0;
            transform-origin: 1169px 446px;
            transform: scale(0.2);
        }
        .rh2-p5-palco.impacto .rh2-crac {
            animation: rh2CracPop 0.72s cubic-bezier(0.2, 1.35, 0.4, 1) forwards;
        }
        #card-5-atirar {
            pointer-events: auto !important;
            opacity: 1 !important;
            cursor: pointer !important;
        }

        @keyframes rh2FlechaVoo {
            0%   { opacity: 1; transform: translate3d(-674px, -39px, 0) rotate(-5deg); }
            45%  { opacity: 1; transform: translate3d(-330px, -68px, 0) rotate(0deg); }
            96%  { opacity: 1; transform: translate3d(-6px, -2px, 0) rotate(2deg); }
            100% { opacity: 1; transform: translate3d(0px, 0px, 0) rotate(0deg); }
        }
        @keyframes rh2RastroVoo {
            0%   { opacity: 0; stroke-dashoffset: 220; }
            20%  { opacity: 0.75; }
            85%  { opacity: 0.55; stroke-dashoffset: 0; }
            100% { opacity: 0; stroke-dashoffset: -120; }
        }
        @keyframes rh2CracPop {
            0%   { opacity: 0; transform: scale(0.25) rotate(-10deg); }
            35%  { opacity: 1; transform: scale(1.18) rotate(4deg); }
            100% { opacity: 0; transform: scale(1.55) rotate(12deg); }
        }
        @keyframes rh2AlvoTremer {
            0%, 100% { transform: translate3d(-36.71%, 0, 0); }
            25% { transform: translate3d(-36.25%, -0.35%, 0); }
            55% { transform: translate3d(-37.05%, 0.25%, 0); }
            80% { transform: translate3d(-36.55%, -0.15%, 0); }
        }

        @keyframes rh2SolRespira {
            0%, 100% { opacity: 0.28; transform: translate3d(0, 0, 0); }
            50% { opacity: 1; transform: translate3d(2.4%, 1.6%, 0); }
        }
        @keyframes rh2Brilho {
            0%, 100% { opacity: 0.26; transform: scale(0.92); }
            50% { opacity: 1; transform: scale(1.06); }
        }
        @keyframes rh2Poeira {
            0%, 100% { opacity: 0.22; transform: translate3d(0, 3.2%, 0); }
            50% { opacity: 1; transform: translate3d(3.8%, -5.5%, 0); }
        }
        @keyframes rh2Flamula {
            0%, 100% { transform: rotate(-5.5deg) skewX(-2deg); }
            50% { transform: rotate(5.5deg) skewX(2.5deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .camada[data-camada="c-sol-p1"] .camada-arte::before,
            .camada[data-camada="c-sol-p1"] .camada-arte::after,
            .camada[data-camada="c-sol-p13"] .camada-arte::before,
            .camada[data-camada="c-sol-p13"] .camada-arte::after,
            .camada[data-camada="c-brilho-p0"] .camada-arte::before,

            .camada[data-camada="c-lenco-p10"] > .camada-arte,
            .rh2-p5-mundo,
            .rh2-flecha-robin,
            .rh2-rastro,
            .rh2-crac {
                animation: none !important;
                transition: none !important;
            }
            .rh2-p5-palco.disparou .rh2-flecha-robin { opacity: 1; transform: translate3d(0, 0, 0); }
        }
    </style>

    <script>
    /* =========================================================================
       ROBIN HOOD — PARTE 2: A FLECHA DE OURO E O RESGATE NA TORRE (RASCUNHO)

    window.LIVRO = {
        obra: 'Robin Hood',
        autor: 'Howard Pyle e lendas tradicionais',
        parte: 2,
        totalPartes: 6,
        imagens: './imagens/parte-2/',
        fim: {
            mensagem: '🏹 Clara Escarlate agora faz parte do Bando Verde, e o ouro da flecha virou comida e cobertor para a vila! Mas o Xerife resolveu encarecer a feira de Nortigão — descubra na Parte 3 o plano maluco de Robin vestido de açougueiro!'
        },
        paginas: [
            {
                capa: true,
                titulo: 'Parte 2: A Flecha de Ouro e o Resgate na Torre',
                texto: `Nesta parte, o Xerife de Nortigão anuncia um campeonato de arco e flecha com um prêmio de brilhar os olhos: uma {{FLECHA|FLE • CHA|🏹}} inteirinha de ouro! O povo todo vai querer ver quem tem a melhor pontaria. Só que a praça vai estar cheia de guardas, procurando qualquer pedacinho de roupa verde.

                    Para entrar na disputa sem ser descoberto, Robin Hood vai precisar de um plano bem esperto e da ajuda de uma nova amiga, que entende tudo de cores e de tecidos. Mas o perigo aparece quando ninguém espera!

                    Depois, cada {{PISTA|PIS • TA|🔎}} pelo caminho vai fazer diferença para descobrir um segredo guardado numa torre alta. E vai ser preciso muita {{CORAGEM|CO • RA • GEM|💪}}, um bocado de esperteza e algumas boas risadas!`,
                cena: {
                    real: 'p0-real.webp', emoji: '🏹',
                    alt: 'Sob um arco de folhas de Xervedo e uma Flecha de Ouro brilhante, Robin Hood, Lady Mariana, João Pequeno, Grilo e Clara Escarlate sorriem diante da silhueta da Torre Velha',
                    legendaReal: '🏹 A Flecha de Ouro e o Resgate na Torre',
                    camadas: [
                        { id: 'c-brilho-p0', fundo: 'transparent', x: 50, y: 100, w: 100, h: 100, z: 6 }
                    ],
                    hotspots: [
                        { x: 34, y: 18, w: 32, h: 16, palavra: 'FLECHA', emoji: '🏹' },
                        { x: 16, y: 40, w: 68, h: 42, palavra: 'CORAGEM', emoji: '💪' },
                        { x: 74, y: 30, w: 18, h: 30, palavra: 'PISTA', emoji: '🔎' }
                    ]
                }
            },
            {
                capitulo: '🏹 Capítulo 12 • O Cartaz da Flecha de Ouro', corCapitulo: 'text-amber-700',
                titulo: 'Uma Armadilha que Pode Ajudar a Vila',
                texto: `Na manhã seguinte, os passarinhos acordaram Xervedo: piu, piu, piu! Debaixo do Grande Carvalho, os cinco amigos rodeavam a mesa de tronco. No meio dela, preso com pedrinhas, estava o cartaz da {{FLECHA|FLE • CHA|🏹}} de Ouro.

                    João Pequeno coçou a barba. — Desde que tiramos Mestre Tomé da cadeia e devolvemos a farinha, o Xerife procura roupa verde em todo canto! A praça vai estar cheia de guardas. Mestre Tomé esfregou as mãos geladas. — O frio vem chegando, e muitas famílias da Vila do Moinho não têm cobertor nem comida guardada. Com esse {{OURO|OU • RO|✨}}, dava para encher as panelas e agasalhar todo mundo!

                    Robin olhou a própria camisa, verdinha feito folha nova, e franziu a testa. — Se eu aparecer assim em Nortigão, os guardas me pegam num piscar de olhos! Ele precisava de um {{DISFARCE|DIS • FAR • CE|🎭}}: uma roupa de outra cor, longe do verde da mata, para ninguém descobrir quem estava dentro.

                    Lady Mariana bateu palmas. — Conheço a pessoa certa! Minha amiga Clara Escarlate é tintureira: mergulha os panos em tachos de tinta, e eles saem de todas as cores. E costura como ninguém! Ficou combinado: antes do meio-dia, o bando ia bater na porta da oficina dela.`,
                cena: {
                    real: 'p1-real.webp', emoji: '🏹',
                    alt: 'Debaixo do Grande Carvalho, Robin Hood, Lady Mariana, Mestre Tomé, Grilo e João Pequeno cercam a mesa de tronco com o cartaz da Flecha de Ouro preso por pedrinhas',
                    legendaReal: '🏹 O Cartaz da Flecha de Ouro no Grande Carvalho',
                    camadas: [
                        { id: 'c-sol-p1', fundo: 'transparent', x: 50, y: 100, w: 100, h: 100, z: 6 }
                    ],
                    hotspots: [
                        { x: 40, y: 65, w: 20, h: 12, palavra: 'FLECHA', emoji: '🏹' },
                        { x: 45, y: 40, w: 12, h: 25, palavra: 'OURO', emoji: '✨' },
                        { x: 22, y: 32, w: 16, h: 48, palavra: 'DISFARCE', emoji: '🎭' }
                    ]
                }
            },
            {
                capitulo: '🎨 Capítulo 13 • A Oficina das Cores', corCapitulo: 'text-rose-700',
                titulo: 'Quem É Clara Escarlate?',
                texto: `Antes do meio-dia, Lady Mariana levou Robin e Grilo por uma ruela calma de Nortigão. Para esconder o verde, os três usavam capas marrons por cima da roupa. No fim da ruela, panos azuis, amarelos e cor-de-rosa dançavam nos varais de uma casinha. Era a {{OFICINA|O • FI • CI • NA|🧵}} de Clara Escarlate.

                    Clara abriu a porta toda animada, de avental pintadinho de respingos. Lá dentro, tachos enormes guardavam {{TINTA|TIN • TA|🎨}} feita de cascas, flores e raízes, e tudo cheirava a chá. Mas a cor mais famosa de Clara, que ninguém mais sabia fazer, era um {{VERMELHO|VER • ME • LHO|🧣}} vivo feito brasa, como o lenço no pescoço dela!

                    Enquanto servia água fresquinha, Clara contou que os guardas do Xerife também cobravam impostos injustos das costureiras e das feirantes da cidade. Quando ouviu como o bando tinha ajudado as famílias da Vila do Moinho, os olhos dela brilharam. — Até que enfim alguém teve coragem!

                    Mariana abriu o cartaz da Flecha de Ouro na mesa. Clara deu um sorriso esperto, pegou a fita de medir e olhou Robin da ponta do capuz até o bico das botas. — Vou transformar você num viajante tão comum que nem o Xerife vai reconhecer!`,

                    real: 'p2-real.webp', emoji: '🎨',
                    alt: 'Na oficina colorida de tinturaria, Clara Escarlate de lenço vermelho-escarlate e avental respingado recebe Lady Mariana, Robin e Grilo com um grande tacho de tinta escarlate à frente',

                        { x: 5, y: 34, w: 20, h: 52, palavra: 'OFICINA', emoji: '🧵' },
                        { x: 34, y: 70, w: 34, h: 26, palavra: 'TINTA', emoji: '🎨' },
                        { x: 26, y: 28, w: 14, h: 34, palavra: 'VERMELHO', emoji: '🧣' }
                    ]
                }
