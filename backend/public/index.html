<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderação · Clássicos Vivos</title>
    <style>
        :root {
            --bg: #FFFBEB;
            --card: #FFFFFF;
            --border: #FDE68A;
            --ink: #451A03;
            --muted: #78350F;
            --accent: #D97706;
            --ok: #059669;
            --danger: #DC2626;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
            padding: 16px;
        }
        .wrap { max-width: 820px; margin: 0 auto; }
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }
        h1 { font-size: 1.35rem; margin: 0; }
        .links { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 2px solid var(--border);
            background: var(--card);
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
        }
        .card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(120, 53, 15, 0.06);
        }
        .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        input[type="password"] {
            flex: 1 1 220px;
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
        }
        button {
            cursor: pointer;
            border: 0;
            border-radius: 10px;
            padding: 9px 14px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-ok { background: var(--ok); color: #fff; }
        .btn-warn { background: #FEF3C7; color: var(--muted); border: 1px solid #F59E0B; }
        .btn-danger { background: #FEE2E2; color: var(--danger); }
        .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
        .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .tab {
            background: #FEF3C7;
            color: var(--muted);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 8px 12px;
        }
        .tab.ativo { background: var(--ink); color: #FFFBEB; }
        .meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
        .texto {
            background: #FFFBEB;
            border-radius: 10px;
            padding: 10px 12px;
            margin: 8px 0 12px;
            white-space: pre-wrap;
        }
        .erro { color: var(--danger); font-weight: 600; margin-top: 8px; font-size: 0.9rem; }
        .vazio { text-align: center; color: var(--muted); padding: 28px 12px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>🛡️ Moderação · Clássicos Vivos</h1>
        <div class="links">
            <a class="chip" href="https://github.com/geraldotfilho/classicos-vivos/issues?q=is%3Aissue+is%3Aopen+label%3Arevisao-autor" target="_blank" rel="noopener">🔑 Revisões do Autor</a>
            <a class="chip" href="https://github.com/geraldotfilho/classicos-vivos/issues?q=is%3Aissue+is%3Aopen+label%3Asugestao-leitor" target="_blank" rel="noopener">💬 Sugestões de Leitores</a>
        </div>
    </header>

    <section id="tela-login" class="card">
        <p style="margin-top:0">Digite sua <strong>chave secreta de autor</strong> para moderar os comentários das avaliações:</p>
        <form id="form-login" class="row">
            <input id="input-chave" type="password" placeholder="Chave do autor" autocomplete="current-password" required>
            <button class="btn-primary" type="submit">Entrar</button>
        </form>
        <label style="display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:0.85rem;color:var(--muted)">
            <input id="manter-login" type="checkbox"> Manter conectado neste aparelho
        </label>
        <div id="login-erro" class="erro hidden"></div>
    </section>

    <section id="tela-painel" class="hidden">
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
            <div class="tabs" id="tabs">
                <button class="tab ativo" data-status="pendente">Pendentes (<span id="cnt-pendente">0</span>)</button>
                <button class="tab" data-status="aprovado">Aprovados (<span id="cnt-aprovado">0</span>)</button>
                <button class="tab" data-status="rejeitado">Rejeitados (<span id="cnt-rejeitado">0</span>)</button>
                <button class="tab" data-status="todos">Todos</button>
            </div>
            <div class="row">
                <button id="btn-atualizar" class="btn-ghost" type="button">Atualizar</button>
                <button id="btn-sair" class="btn-ghost" type="button">Sair</button>
            </div>
        </div>
        <div id="painel-erro" class="erro hidden"></div>
        <div id="lista"></div>
    </section>
</div>

<script>
const STORAGE_KEY = 'cv-admin-chave';
let chaveAtual = localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY) || '';
let statusAtual = 'pendente';

function esc(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function estrelasHtml(n) {
    const val = Number(n);
    if (!Number.isFinite(val)) return '';
    return '★'.repeat(val) + '☆'.repeat(5 - val) + ` (${val}/5)`;
}

function mostrarLogin(msg) {
    document.getElementById('tela-login').classList.remove('hidden');
    document.getElementById('tela-painel').classList.add('hidden');
    const err = document.getElementById('login-erro');
    if (msg) { err.textContent = msg; err.classList.remove('hidden'); }
    else { err.classList.add('hidden'); }
}

async function carregarLista() {
    const err = document.getElementById('painel-erro');
    err.classList.add('hidden');
    const res = await fetch(`/api/admin?status=${encodeURIComponent(statusAtual)}`, {
        headers: { Authorization: `Bearer ${chaveAtual}` }
    });
    if (res.status === 401) {
        chaveAtual = '';
        localStorage.removeItem(STORAGE_KEY);
        sessionStorage.removeItem(STORAGE_KEY);
        mostrarLogin('Chave inválida ou expirada.');
        return;
    }
    const dados = await res.json();
    if (!res.ok) {
        err.textContent = dados.erro || 'Erro ao carregar.';
        err.classList.remove('hidden');
        return;
    }
    document.getElementById('tela-login').classList.add('hidden');
    document.getElementById('tela-painel').classList.remove('hidden');

    const c = dados.contadores || {};
    document.getElementById('cnt-pendente').textContent = c.pendente || 0;
    document.getElementById('cnt-aprovado').textContent = c.aprovado || 0;
    document.getElementById('cnt-rejeitado').textContent = c.rejeitado || 0;

    const lista = document.getElementById('lista');
    if (!dados.comentarios || !dados.comentarios.length) {
        lista.innerHTML = '<div class="card vazio">Nenhum comentário nesta aba.</div>';
        return;
    }

    lista.innerHTML = dados.comentarios.map(item => {
        const data = new Date(item.criado_em).toLocaleString('pt-BR');
        const emailHtml = item.email
            ? ` · 📧 <a href="mailto:${esc(item.email)}">${esc(item.email)}</a>`
            : '';
        return `
        <article class="card">
            <div class="meta">
                <strong>${esc(item.obra)} · Parte ${esc(item.parte)}</strong> · ${estrelasHtml(item.estrelas)}<br>
                Por <strong>${esc(item.nome || 'Leitor(a)')}</strong>${emailHtml} · ${esc(data)} · <em>${esc(item.status)}</em>
            </div>
            <div class="texto">${esc(item.comentario)}</div>
            <div class="row">
                ${item.status !== 'aprovado' ? `<button class="btn-ok" data-id="${esc(item.id)}" data-acao="aprovar">✓ Aprovar</button>` : ''}
                ${item.status !== 'rejeitado' ? `<button class="btn-warn" data-id="${esc(item.id)}" data-acao="rejeitar">✕ Rejeitar</button>` : ''}
                <button class="btn-danger" data-id="${esc(item.id)}" data-acao="excluir">🗑 Excluir</button>
            </div>
        </article>`;
    }).join('');
}

document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    chaveAtual = document.getElementById('input-chave').value.trim();
    if (!chaveAtual) return;
    if (document.getElementById('manter-login').checked) localStorage.setItem(STORAGE_KEY, chaveAtual);
    else sessionStorage.setItem(STORAGE_KEY, chaveAtual);
    await carregarLista();
});

document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    statusAtual = btn.dataset.status;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('ativo', t === btn));
    carregarLista();
});

document.getElementById('lista').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-id]');
    if (!btn) return;
    const { id, acao } = btn.dataset;
    if (acao === 'excluir' && !confirm('Excluir este comentário definitivamente?')) return;
    btn.disabled = true;
    const res = await fetch('/api/admin', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${chaveAtual}`
        },
        body: JSON.stringify({ id, acao })
    });
    if (!res.ok) {
        alert('Erro ao executar ação.');
        btn.disabled = false;
        return;
    }
    await carregarLista();
});

document.getElementById('btn-atualizar').addEventListener('click', carregarLista);
document.getElementById('btn-sair').addEventListener('click', () => {
    chaveAtual = '';
    localStorage.removeItem(STORAGE_KEY);
    sessionStorage.removeItem(STORAGE_KEY);
    mostrarLogin('');
});

if (chaveAtual) carregarLista();
</script>
</body>
</html>
