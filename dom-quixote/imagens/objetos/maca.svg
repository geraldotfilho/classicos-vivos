<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="appleGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="55%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#450A0A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Cabin/Stem -->
    <path d="M58 28 Q62 12 70 10" fill="none" stroke="#78350F" stroke-width="6" stroke-linecap="round"/>
    <!-- Folha -->
    <path d="M62 22 Q85 10 92 26 Q75 36 62 22 Z" fill="url(#leafGrad)" stroke="#14532D" stroke-width="3"/>
    <!-- Corpo da Maçã -->
    <path d="M60 30 C42 22, 18 35, 20 62 C22 90, 44 108, 56 105 C60 104, 60 104, 64 105 C76 108, 98 90, 100 62 C102 35, 78 22, 60 30 Z" fill="url(#appleGrad)" stroke="#4C0519" stroke-width="3.5"/>
    <!-- Brilho Aquarela -->
    <ellipse cx="40" cy="52" rx="9" ry="16" transform="rotate(-18 40 52)" fill="#FFE4E6" opacity="0.65"/>
    <circle cx="34" cy="72" r="4" fill="#FFE4E6" opacity="0.5"/>
  </g>
</svg>
