                girar('slow');
                for (let k = 0; k < 6; k++) {
                    setTimeout(() => {
                        const rajada = document.createElement('div');
                        rajada.className = 'wind-gust-particle';
                        rajada.textContent = '💨';
                        rajada.style.top = (15 + Math.random() * 45) + '%';
                        rajada.style.left = (5 + Math.random() * 25) + '%';
                        rajadas.appendChild(rajada);
                        setTimeout(() => rajada.remove(), 1200);
                    }, k * 180);
                }
                setTimeout(() => girar('fast'), 450);
                setTimeout(() => { girar('turbo'); livro.som('lensMagic'); }, 900);
                setTimeout(() => {
                    window.ventoSoprando = false;
                    if (!livro.lenteImaginacao()) livro.definirLente(true);
                }, 1500);
            }
        }
    };
    </script>
    <script src="../assets/js/livro.js"></script>
</body>
