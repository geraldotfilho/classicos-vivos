<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220">
  <defs>
    <!-- Gradiente da Juba do Leão -->
    <radialGradient id="maneGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <!-- Gradiente do Corpo Dourado -->
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <!-- Sombra Suave -->
    <filter id="lionGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#451A03" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#lionGlow)">
    <!-- Cauda de leão com tufo felpudo -->
    <path d="M 50 145 C 10 135, 10 178, 38 185" fill="none" stroke="#D97706" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="36" cy="186" rx="18" ry="14" fill="url(#maneGrad)" stroke="#78350F" stroke-width="3"/>

    <!-- Corpo Dourado Sólido e Fofinho de Leãozinho Deitado (Cobre 100% da área do gatinho) -->
    <ellipse cx="110" cy="155" rx="65" ry="38" fill="url(#furGrad)" stroke="#78350F" stroke-width="4"/>
    <ellipse cx="150" cy="148" rx="80" ry="46" fill="url(#furGrad)" stroke="#78350F" stroke-width="4"/>
    <ellipse cx="75" cy="158" rx="42" ry="32" fill="url(#furGrad)" stroke="#78350F" stroke-width="3.5"/>

    <!-- Patinhas Dianteiras Cruzadas -->
    <ellipse cx="180" cy="172" rx="24" ry="14" fill="url(#furGrad)" stroke="#78350F" stroke-width="3.5"/>
    <ellipse cx="204" cy="168" rx="22" ry="14" fill="url(#furGrad)" stroke="#78350F" stroke-width="3.5"/>
    <!-- Almofadinhas fofas -->
    <circle cx="176" cy="172" r="3.5" fill="#B45309"/>
    <circle cx="184" cy="172" r="3.5" fill="#B45309"/>
    <circle cx="200" cy="168" r="3.5" fill="#B45309"/>
    <circle cx="208" cy="168" r="3.5" fill="#B45309"/>

    <!-- GRANDE JUBA FELPUDA DE LEÃO GUARDIÃO -->
    <g transform="translate(185, 82)">
      <!-- Juba em pétalas fofas com volume -->
      <circle cx="0" cy="0" r="56" fill="url(#maneGrad)" stroke="#78350F" stroke-width="4.5"/>
      <circle cx="-38" cy="-26" r="24" fill="url(#maneGrad)"/>
      <circle cx="0" cy="-45" r="26" fill="url(#maneGrad)"/>
      <circle cx="38" cy="-26" r="24" fill="url(#maneGrad)"/>
      <circle cx="45" cy="16" r="24" fill="url(#maneGrad)"/>
      <circle cx="28" cy="42" r="24" fill="url(#maneGrad)"/>
      <circle cx="-28" cy="42" r="24" fill="url(#maneGrad)"/>
      <circle cx="-45" cy="16" r="24" fill="url(#maneGrad)"/>

      <!-- Orelhinhas redondas de leão -->
      <circle cx="-28" cy="-34" r="15" fill="url(#furGrad)" stroke="#78350F" stroke-width="3.5"/>
      <circle cx="-28" cy="-34" r="7.5" fill="#F43F5E"/>
      <circle cx="28" cy="-34" r="15" fill="url(#furGrad)" stroke="#78350F" stroke-width="3.5"/>
      <circle cx="28" cy="-34" r="7.5" fill="#F43F5E"/>

      <!-- Rostinho Adorável e Amigável do Leãozinho -->
      <ellipse cx="0" cy="6" rx="38" ry="34" fill="url(#furGrad)" stroke="#78350F" stroke-width="3.5"/>

      <!-- Focinho fofo e bochechas rosadas -->
      <ellipse cx="-12" cy="18" rx="15" ry="12" fill="#FEF3C7"/>
      <ellipse cx="12" cy="18" rx="15" ry="12" fill="#FEF3C7"/>
      <!-- Nariz triangular de leão -->
      <polygon points="0,11 -11,1 11,1" fill="#991B1B" stroke="#450A0A" stroke-width="2"/>
      <!-- Boquinha sorrindo feliz -->
      <path d="M -10 19 Q 0 26 10 19" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>

      <!-- Olhinhos expressivos alegres de desenho infantil -->
      <ellipse cx="-15" cy="-2" rx="6.5" ry="8.5" fill="#1E293B"/>
      <circle cx="-17" cy="-5" r="2.8" fill="#FFFFFF"/>
      <ellipse cx="15" cy="-2" rx="6.5" ry="8.5" fill="#1E293B"/>
      <circle cx="13" cy="-5" r="2.8" fill="#FFFFFF"/>

      <!-- Sobrancelhas brincalhonas -->
      <path d="M -22 -12 Q -15 -17 -8 -12" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 8 -12 Q 15 -17 22 -12" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Bigodinhos dourados -->
      <line x1="-24" y1="14" x2="-40" y2="10" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
      <line x1="-24" y1="18" x2="-40" y2="20" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
      <line x1="24" y1="14" x2="40" y2="10" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
      <line x1="24" y1="18" x2="40" y2="20" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>

      <!-- Coroinha Dourada de Guardião Real na Cabeça -->
      <g transform="translate(0, -45)">
        <polygon points="-18,14 -14,-4 0,5 14,-4 18,14" fill="#FACC15" stroke="#B45309" stroke-width="2.5"/>
        <circle cx="-14" cy="-4" r="3.2" fill="#EF4444"/>
        <circle cx="0" cy="5" r="3.8" fill="#3B82F6"/>
        <circle cx="14" cy="-4" r="3.2" fill="#10B981"/>
      </g>
    </g>

    <!-- Estrelinhas cintilantes ao redor do Leão Guardião -->
    <text x="25" y="60" font-size="24">✨</text>
    <text x="270" y="55" font-size="26">🌟</text>
    <text x="260" y="160" font-size="20">✨</text>
  </g>
</svg>