<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="lidGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Borda Externa do Escudo-Tampa -->
    <circle cx="60" cy="60" r="44" fill="url(#lidGrad)" stroke="#334155" stroke-width="4"/>
    <circle cx="60" cy="60" r="35" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="6 4"/>
    <!-- Manchinhas de ferrugem -->
    <circle cx="40" cy="45" r="5" fill="#B45309" opacity="0.55"/>
    <circle cx="78" cy="75" r="6" fill="#92400E" opacity="0.5"/>
    <!-- Puxador de Tampa de Panela no Centro -->
    <path d="M46 60 C46 46, 74 46, 74 60" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <path d="M46 60 C46 46, 74 46, 74 60" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <circle cx="46" cy="60" r="5" fill="#475569"/>
    <circle cx="74" cy="60" r="5" fill="#475569"/>
  </g>
</svg>
