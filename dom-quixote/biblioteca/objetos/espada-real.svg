<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#78350F" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Lâmina Reluzente -->
    <polygon points="104,16 36,72 48,84" fill="url(#bladeGrad)" stroke="#B45309" stroke-width="3.5"/>
    <!-- Guarda Dourada -->
    <path d="M26 60 L60 94" stroke="#D97706" stroke-width="10" stroke-linecap="round"/>
    <path d="M26 60 L60 94" stroke="#FDE047" stroke-width="5" stroke-linecap="round"/>
    <!-- Cabo e Pomo -->
    <line x1="40" y1="80" x2="20" y2="100" stroke="#991B1B" stroke-width="9" stroke-linecap="round"/>
    <circle cx="16" cy="104" r="8" fill="#FACC15" stroke="#B45309" stroke-width="3"/>
  </g>
</svg>
