<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <!-- Hub central -->
    <defs>
        <filter id="bladeShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#451a03" flood-opacity="0.35"/>
        </filter>
    </defs>
    
    <g filter="url(#bladeShadow)" stroke="#5c2d13" stroke-linecap="round" stroke-linejoin="round">
        <!-- Pá 1: Cima -->
        <g id="blade-unit">
            <!-- Viga principal -->
            <line x1="100" y1="100" x2="100" y2="10" stroke-width="4.5"/>
            <!-- Varas da grade de madeira -->
            <line x1="100" y1="20" x2="124" y2="20" stroke-width="2.5"/>
            <line x1="100" y1="35" x2="124" y2="35" stroke-width="2.5"/>
            <line x1="100" y1="50" x2="124" y2="50" stroke-width="2.5"/>
            <line x1="100" y1="65" x2="124" y2="65" stroke-width="2.5"/>
            <line x1="100" y1="80" x2="124" y2="80" stroke-width="2.5"/>
            <!-- Moldura externa e cruzada da treliça -->
            <line x1="124" y1="18" x2="124" y2="82" stroke-width="2.5"/>
            <line x1="112" y1="18" x2="112" y2="82" stroke-width="1.8"/>
            <rect x="100" y="18" width="24" height="64" fill="#d97706" fill-opacity="0.12" stroke="none"/>
        </g>
        
        <!-- Pá 2: Direita (girada 90 graus) -->
        <use href="#blade-unit" transform="rotate(90 100 100)"/>
        
        <!-- Pá 3: Baixo (girada 180 graus) -->
        <use href="#blade-unit" transform="rotate(180 100 100)"/>
        
        <!-- Pá 4: Esquerda (girada 270 graus) -->
        <use href="#blade-unit" transform="rotate(270 100 100)"/>
    </g>
    
    <!-- Centro do Eixo -->
    <circle cx="100" cy="100" r="10" fill="#92400e" stroke="#451a03" stroke-width="3.5"/>
    <circle cx="100" cy="100" r="4" fill="#fbbf24"/>
</svg>
